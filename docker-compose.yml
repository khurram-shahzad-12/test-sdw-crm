# Production
services:
  frontend:
    build:
      context: ./app/client
    expose:
      - "80"
    restart: always
    depends_on:
      - backend
    networks:
      - sdw-crm-network

  backend:
    build:
      context: ./app/server
    env_file:
      - ./app/server/.env
    expose:
      - "8000"
    restart: always
    depends_on:
      - routeplanner
      - mongodb
    networks:
      - sdw-crm-network

  routeplanner:
    build:
      context: ./routeplanner
    env_file:
      - ./routeplanner/.env
    environment:
      MONGO_URI: mongodb://mongodb:27017/spice_direct
    expose:
      - "5000"
    restart: always
    depends_on:
      - osrm
      - mongodb
    networks:
      - sdw-crm-network

  osrm:
    image: osrm/osrm-backend
    container_name: crm-copy-osrm
    expose:
      - "5000"
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/uk-latest.osrm
    restart: always
    networks:
      - sdw-crm-network

  mongodb:
    image: mongo:7.0
    container_name: sdw-crm-mongodb
    restart: always
    # environment:
    #   MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
    #   MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS}
    volumes:
      - mongo_data:/data/db
    networks:
      - sdw-crm-network

  nginx:
    image: nginx:latest
    container_name: sdw-crm-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt
      - ./certbot:/var/www/certbot
    restart: always
    depends_on:
      - frontend
      - backend
      - routeplanner
    networks:
      - sdw-crm-network

  certbot:
    image: certbot/certbot:latest
    container_name: sdw-crm-certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./certbot:/var/www/certbot
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"
    restart: always
    networks:
      - sdw-crm-network

volumes:
  mongo_data:

networks:
  sdw-crm-network:
    driver: bridge